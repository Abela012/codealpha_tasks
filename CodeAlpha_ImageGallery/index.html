<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery | CodeAlpha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Image Gallery</h1>
    <p>Responsive gallery with categories and lightbox preview</p>
  </header>

  <main>
    <div class="filters">
      <button class="filter active" data-category="all">All</button>
      <button class="filter" data-category="nature">Nature</button>
      <button class="filter" data-category="city">City</button>
      <button class="filter" data-category="animals">Animals</button>
    </div>

    <section class="gallery" id="gallery">
      <article class="card" data-category="nature">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape">
        <div class="caption">Mountain Landscape</div>
      </article>
      <article class="card" data-category="nature">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Ocean beach">
        <div class="caption">Ocean Beach</div>
      </article>
      <article class="card" data-category="city">
        <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=900&q=80" alt="City skyline">
        <div class="caption">City Skyline</div>
      </article>
      <article class="card" data-category="city">
        <img src="https://images.unsplash.com/photo-1444723121867-7a241cacace9?auto=format&fit=crop&w=900&q=80" alt="City street">
        <div class="caption">City Street</div>
      </article>
      <article class="card" data-category="animals">
        <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=900&q=80" alt="Dog">
        <div class="caption">Happy Dog</div>
      </article>
      <article class="card" data-category="animals">
        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=900&q=80" alt="Cat">
        <div class="caption">Cute Cat</div>
      </article>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="close" id="close">&times;</button>
    <button class="nav prev" id="prev">&#10094;</button>
    <img id="lightboxImage" src="" alt="">
    <button class="nav next" id="next">&#10095;</button>
    <div class="lightboxCaption" id="lightboxCaption"></div>
  </div>

  <footer>CodeAlpha Frontend Development Internship — Task 1</footer>
  <script src="script.js"></script>
</body>
</html>
